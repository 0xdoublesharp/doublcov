packages:
  - "apps/*"
  - "packages/*"

overrides:
  # typed-rest-client pins a vulnerable qs version; remove when upstream updates.
  "typed-rest-client@2.3.1>qs": "6.17.1"
  # Remove when consumers adopt the patched glob and minimatch major versions.
  "glob@13": "14.0.4"
  "minimatch@10": "11.0.5"

packageExtensions:
  # Stryker's tsconfig preprocessor imports the compiler without declaring it.
  "@stryker-mutator/core@10.1.1":
    peerDependencies:
      typescript: ">=5.0.0 <6.1.0"
